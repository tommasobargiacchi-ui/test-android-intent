name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
defaults:
      run:
        working-directory: ./test-app
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 1. Installa Gradle a livello di sistema sul runner Linux
     # - name: Install system Gradle
     #   run: sudo apt-get update && sudo apt-get install -y gradle

      # 2. Genera i file mancanti del Gradle Wrapper nella cartella del progetto
      #- name: Generate Gradle Wrapper
      #  run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --warning-mode all --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
